name: Daily Inventory Dashboard Update

on:
  schedule:
    - cron: '0 12 * * *'   # 7:00 AM US Eastern (UTC-5) = 12:00 UTC
  workflow_dispatch:        # also allows a manual "Run workflow" button in GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > /tmp/google_creds.json

      - name: Run dashboard update
        env:
          LWA_APP_ID:            ${{ secrets.LWA_APP_ID }}
          LWA_CLIENT_SECRET:     ${{ secrets.LWA_CLIENT_SECRET }}
          SP_API_REFRESH_TOKEN:  ${{ secrets.SP_API_REFRESH_TOKEN }}
          MARKETPLACE_ID:        ATVPDKIKX0DER
          FORECAST_SHEET_ID:     ${{ secrets.FORECAST_SHEET_ID }}
          GOOGLE_CREDENTIALS_PATH: /tmp/google_creds.json
          SLACK_WEBHOOK_URL:     ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python update_sheets.py

      - name: Save updated sales history back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sales_history.json data/reorder_state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update sales history + reorder state [skip ci]"
          # A second workflow or repository edit can advance master while this
          # job is fetching inventory. Rebase our state commit before pushing.
          for attempt in 1 2 3; do
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "State commit conflicts with updated master; review required" >&2
              exit 1
            fi
            if git push origin HEAD:master; then
              echo "Updated state committed successfully"
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
            sleep 5
          done
          echo "Unable to push state after 3 attempts" >&2
          exit 1
